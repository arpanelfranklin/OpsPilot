global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opspilot'

scrape_configs:
  # ── Spring Boot Backend (Micrometer / Actuator) ──────────────────────────────
  - job_name: 'opspilot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 10s

  # ── Prometheus itself ─────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
