services:

  # ─────────────────────────────── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"           # expose to host so you can connect with pgAdmin/psql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opspilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────── Backend ─────────────────────────────────────
  backend:
    build:
      context: .          # uses ./Dockerfile in project root
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"       # expose to host for direct API access / testing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_PORT: "8080"
      SPRING_JACKSON_DEFAULT_PROPERTY_INCLUSION: non_null
      # Expose actuator endpoints for Prometheus scraping
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    networks:
      - opspilot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s   # give Spring Boot time to start and seed data

  # ─────────────────────────────── Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend   # uses ./frontend/Dockerfile
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"           # open http://localhost:3000 in your browser
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opspilot

  # ─────────────────────────────── Prometheus ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opspilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"         # open http://localhost:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opspilot

  # ─────────────────────────────── Grafana ─────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: opspilot-grafana
    restart: unless-stopped
    ports:
      - "9000:3000"         # open http://localhost:9000  (admin / admin)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:9000"
    depends_on:
      - prometheus
    networks:
      - opspilot

# ─────────────────────────────── Volumes & Networks ──────────────────────────
volumes:
  postgres_data:
    name: opspilot_postgres_data
  prometheus_data:
    name: opspilot_prometheus_data
  grafana_data:
    name: opspilot_grafana_data

networks:
  opspilot:
    driver: bridge
    name: opspilot_network
