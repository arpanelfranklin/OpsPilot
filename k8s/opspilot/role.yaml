# ClusterRole: read-only access to nodes and namespaces (cluster-scoped resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-cluster-reader
  labels:
    app: opspilot
    component: rbac
rules:
  # Cluster-scoped: nodes and namespaces discovery only
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
    verbs:
      - get
      - list
      - watch
---
# Role: read-only access to namespaced resources (applied to opspilot-demo and opspilot namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-namespace-reader
  labels:
    app: opspilot
    component: rbac
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
