apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-frontend
  namespace: opspilot
  labels:
    app: opspilot-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspilot-frontend
  template:
    metadata:
      labels:
        app: opspilot-frontend
        tier: frontend
    spec:
      containers:
        - name: opspilot-frontend
          image: opspilot-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: opspilot-frontend-nginx
      restartPolicy: Always
