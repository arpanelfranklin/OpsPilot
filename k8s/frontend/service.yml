apiVersion: v1
kind: Service
metadata:
  name: opspilot-frontend
  namespace: opspilot
  labels:
    app: opspilot-frontend
spec:
  type: NodePort
  selector:
    app: opspilot-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080     # maps to hostPort 8080 in kind config → http://localhost:8080
