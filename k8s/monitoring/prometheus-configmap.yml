apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: opspilot
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'opspilot'

    scrape_configs:
      - job_name: 'opspilot-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['opspilot-backend:80']
        scrape_interval: 10s

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
