apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: opspilot-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Frontend → http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Prometheus → http://localhost:9090
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Grafana → http://localhost:9001
      - containerPort: 30091
        hostPort: 9001
        protocol: TCP
  - role: worker
  - role: worker
