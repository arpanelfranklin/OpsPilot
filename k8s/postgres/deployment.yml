apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-postgres
  namespace: opspilot
  labels:
    app: opspilot-postgres
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-postgres
  strategy:
    type: Recreate          # required for single-replica stateful workload with RWO volume
  template:
    metadata:
      labels:
        app: opspilot-postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opspilot-secrets
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opspilot-secrets
                  key: postgres-password
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: opspilot-postgres-pvc
      restartPolicy: Always
