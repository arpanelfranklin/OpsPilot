apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: opspilot-demo
  labels:
    app: demo-backend
    tier: backend
    demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
        tier: backend
    spec:
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  namespace: opspilot-demo
spec:
  selector:
    app: demo-backend
  ports:
    - port: 80
      targetPort: 80
