apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-backend
  namespace: opspilot
  labels:
    app: opspilot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspilot-backend
  template:
    metadata:
      labels:
        app: opspilot-backend
    spec:
      containers:
        - name: opspilot-backend
          image: opspilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: opspilot-secrets
                  key: mongodb-uri
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
      restartPolicy: Always
